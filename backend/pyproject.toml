[project]
name = "social-trend-analyzer-backend"
version = "0.1.0"
description = "Social Trend Analyzer backend API and processing engine"
readme = "../README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg2-binary>=2.9.10",
    "python-multipart>=0.0.22",
    "pandas>=2.2,<4",
    "numpy>=1.26,<3",
    "scikit-learn>=1.5,<2",
    "emoji>=2.14,<3",
    "transformers>=4.46,<6",
    "sentence-transformers>=3.3,<7",
    "torch>=2.5,<3",
    "spacy>=3.8,<3.9",
    "bertopic>=0.17,<0.18",
    "umap-learn>=0.5.7,<0.6",
    "hdbscan>=0.8.40,<0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6,<8",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = []

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["full_nlp: real local model smoke tests (require downloaded weights)"]
